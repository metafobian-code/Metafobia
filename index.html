<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Metafobia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="layout">
  <section class="col col--left">
    <header class="head">
      <h1 class="title">Metafobia</h1>
      <p class="subtitle">en construcción</p>
    </header>

    <nav class="list-wrap" aria-label="Proyectos" id="listWrap">
      <ul class="list" id="projectList"></ul>

      <svg class="octopus" id="octopus" width="1" height="1" aria-hidden="true" focusable="false">
        <g id="octoPos">
          <g id="tentacles" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"></g>
          <g id="octoHead">
            <path d="M-13 -22 C-15 -43 15 -43 13 -22 C13 -15 8 -12 0 -12 C-8 -12 -13 -15 -13 -22 Z" fill="#fff"/>
            <ellipse cx="-3" cy="-24" rx="2.4" ry="3.2" fill="#000"/>
            <ellipse cx="6" cy="-24" rx="2.4" ry="3.2" fill="#000"/>
          </g>
        </g>
      </svg>
    </nav>
  </section>

  <section class="col col--right" aria-hidden="true">
    <img class="art" src="imagen.png" alt="">
  </section>
</main>
<script src="script.js"></script>
</body>
</html>

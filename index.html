<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Metafobia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="layout">
  <section class="col col--left">
    <header class="head">
      <h1 class="title">Metafobia</h1>
      <p class="subtitle">en construcción</p>
    </header>

    <nav class="list-wrap" aria-label="Proyectos" id="listWrap">
      <ul class="list" id="projectList"></ul>

      <svg class="octopus" id="octopus" viewBox="0 0 120 170" aria-hidden="true" focusable="false">
        <g id="octoBody">
          <g id="tentacles" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"></g>
          <path d="M60 6 C26 6 14 34 18 58 C20 70 28 76 34 80 L86 80 C92 76 100 70 102 58 C106 34 94 6 60 6 Z" fill="#fff"/>
          <ellipse cx="46" cy="50" rx="7" ry="9" fill="#000"/>
          <ellipse cx="74" cy="50" rx="7" ry="9" fill="#000"/>
          <circle cx="48" cy="47" r="2" fill="#fff"/>
          <circle cx="76" cy="47" r="2" fill="#fff"/>
        </g>
      </svg>
    </nav>
  </section>

  <section class="col col--right" aria-hidden="true">
    <img class="art" src="imagen.png" alt="">
  </section>
</main>
<script src="script.js"></script>
</body>
</html>

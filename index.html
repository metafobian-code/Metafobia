<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Metafobia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="layout">
  <section class="col col--left" id="panel">
    <header class="head">
      <h1 class="title">Metafobia</h1>
      <p class="subtitle">en construcción</p>
    </header>

    <nav class="list-wrap" aria-label="Proyectos" id="listWrap">
      <ul class="list" id="projectList"></ul>

      <svg class="octopus" id="octopus" viewBox="0 0 120 150" aria-hidden="true" focusable="false">
        <g class="oct-body">
          <path class="oct-head" d="M60 6 C26 6 14 34 18 58 C20 70 28 76 34 78 L86 78 C92 76 100 70 102 58 C106 34 94 6 60 6 Z" fill="#fff"/>
          <ellipse cx="46" cy="50" rx="7" ry="9" fill="#000"/>
          <ellipse cx="74" cy="50" rx="7" ry="9" fill="#000"/>
          <circle cx="48" cy="47" r="2" fill="#fff"/>
          <circle cx="76" cy="47" r="2" fill="#fff"/>
          <g class="tentacles" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
            <path class="t t1" d="M30 76 C22 96 34 110 24 138"/>
            <path class="t t2" d="M42 78 C36 100 48 114 40 144"/>
            <path class="t t3" d="M53 78 C50 102 58 116 52 146"/>
            <path class="t t4" d="M67 78 C70 102 62 116 68 146"/>
            <path class="t t5" d="M78 78 C84 100 72 114 80 144"/>
            <path class="t t6" d="M90 76 C98 96 86 110 96 138"/>
          </g>
        </g>
      </svg>
    </nav>
  </section>

  <section class="col col--right" id="visual" aria-hidden="true"></section>
</main>
<script src="script.js"></script>
</body>
</html>
